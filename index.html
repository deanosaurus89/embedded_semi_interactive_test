<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Milkyway – Merkmale</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b2330'/%3E%3Cpath d='M2 12 L8 3 L14 12' fill='none' stroke='%23f0b429' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>Merkmale <span id="part-name">Milkyway</span> <span class="badge" id="example-badge">Beispieldaten</span></h1>
        <div class="tools">
          <label class="filter">
            Teile
            <select id="filter" aria-label="Anzahl der angezeigten Teile">
              <option value="10">Letzte 10</option>
              <option value="25" selected>Letzte 25</option>
              <option value="50">Letzte 50</option>
              <option value="all">Alle</option>
            </select>
          </label>
          <div class="mode" role="group" aria-label="Modus">
            <button type="button" id="mode-view" aria-pressed="true" title="Positionen sperren">Ansicht</button>
            <button type="button" id="mode-edit" aria-pressed="false" title="Fähnchen verschieben und Fußpunkte setzen">Bearbeiten</button>
          </div>
          <button type="button" id="export" title="Layout als JSON exportieren">Export</button>
          <button type="button" id="import" title="Layout-JSON importieren">Import</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
          <button type="button" id="reset" title="Gespeichertes Layout verwerfen">Zurücksetzen</button>
        </div>
      </header>
      <div id="stage">
        <canvas id="view" aria-label="3D-Ansicht des Bauteils"></canvas>
        <svg id="leaders" aria-hidden="true"></svg>
        <div id="flags"></div>
        <p id="hint" class="hint" hidden></p>
        <p id="toast" class="toast" role="status" hidden></p>
        <div id="loading" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p id="loading-text">Modell wird geladen …</p>
        </div>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
